; ============================================================================
;  MXCam - dynamic helmet cam for MX Simulator (opengl32.dll proxy)
;
;  Keep this file next to opengl32.dll in the game folder. Press ReloadKey
;  (F9) in-game to re-read it without restarting. Missing keys use the
;  built-in defaults, which match the values below.
;
;  Distances are in game units; MX Simulator appears to use metres.
; ============================================================================

[General]
; The camera mod: 1 = on at launch, 0 = off (the game's own cameras; the shaders below still
; work on their own). ToggleKey flips it in-game, and so does FIRST PERSON > First person mod in the panel.
Enabled=1
; Virtual-key codes, decimal or 0x hex. F8=0x77  F9=0x78  F10=0x79  0 = unbound
ToggleKey=0x77
ReloadKey=0x78
; Logs every matrix call of the next frame to MXS_REMASTERED.log (use it to find ViewMatrixIndex)
DumpKey=0x79
; Opens the in-game settings panel. E=0x45. Can also be changed in the panel (KEYBINDS tab).
MenuKey=0x45
; Saves the last 15 s of per-frame camera data (and 5 s more) to MXS_REMASTERED_trace.csv: press it right
; after something looks wrong and send the file along with bug reports. F11=0x7A
TraceKey=0x7A

[Detection]
; MX Simulator draws with shaders. Each object gets View*Model in this uniform:
ModelviewUniform=u_modelview
; The camera is read from the shader program that has this uniform (the terrain,
; which is drawn with the bare view matrix). Changes to these two need a restart.
CameraProgramUniform=u_heights
; The light direction, which the game sends already turned to its camera. It is
; turned with our view too, so lighting doesn't change when the view is leveled.
LightUniform=u_light_position
; The reflection (environment map) rotation, eye -> world. Corrected the same way so
; reflections don't swim when the view is leveled.
EnvMatrixUniform=u_envmat
; Only for games using the old fixed-function matrix stack: which modelview load
; holds the camera, counted from 0 each frame during 3D drawing.
ViewMatrixIndex=0
; The game world's up axis (x,y,z)
WorldUp=0,1,0
; Larger jumps than these between frames count as camera cuts (respawn, camera
; switch) and reset all the filters instead of being smoothed.
SnapAngleDeg=60
TeleportDistance=5
; The custom camera finds your bike among objects drawn within this distance of
; the game camera (the one that stays fixed to the camera while you ride).
BikeSearchRadius=6

[Camera]
; 0 = adjust the game's own first-person camera.
; 1 = custom camera: the view is built from your bike, so the game's 1st Person
;     Angle and Gimbal settings no longer matter. The game camera's position is
;     still the starting point for the head position offsets below.
;     The first time, needs a few metres of riding to find the bike; after that
;     it recognises the bike as soon as you spawn.
CustomCamera=0
; Custom camera: how far the view looks down, in degrees (negative = up)
CameraAngleDeg=8
; Eye position offsets, in units (metres), along the bike (game camera: along
; the game camera's own axes). + = forward / up.
HeadForward=0
HeadHeight=0
; 1 = hide your own rider's torso and head (helmet included), for high FOVs.
;     Arms and legs stay, and other riders keep theirs.
HideOwnBody=0

[Smoothing]
; Inertial low-pass on head rotation, in 1/seconds. Higher = stiffer and more
; responsive, lower = floatier. 0 = off. Time constant = 1/value (14 -> ~70 ms).
RotationResponse=14
; The smoothed view never trails the real head by more than this many degrees.
MaxLagDeg=12

[Leveling]
; Horizon lock: fraction of the bike's lean (roll) removed from the view.
; 0 = the view leans with the bike, 1 = horizon always level.
HorizonLock=0.6
; Pitch lock: fraction of the bike's pitch removed - wheelies, stoppies, jump
; faces. 0 = the view pitches with the bike, 1 = the view stays at its resting
; pitch. Only pitch away from the bike's resting pitch counts, so riding on flat
; ground looks the same at any setting.
PitchLock=0.5
; Upper limit for the roll removed by HorizonLock, in degrees
MaxRollCorrectionDeg=90
; Steadiness (0..2): the view follows the lean and pitch the locks above leave in it
; through a slow spring, so the bike's quick jolts (bumps, landings, the suspension
; diving under braking) don't reach it, while a corner's lean or a wheelie still does.
; 0 = follows every jolt, 1 = calm, 2 = calmest (and slowest to follow: it hardly leans into a corner).
Steadiness=0.6

[Air]
; In the air the view follows the bike's left / right swing (scrubs, whips) only through a
; slow filter, so it keeps pointing forward more (never more than 15 deg x this behind the bike).
; 0 = follows the bike tightly, 1 = very loose.
AirLooseness=0.6
; In the air the view holds the direction of travel, with the horizon level and the normal
; look-down angle, while the bike swings, leans and tilts under it (whips, scrubs); it eases
; back onto the bike after landing. 0 = off, 1 = completely straight.
WhipLock=0

[Look]
; MX Simulator has no look keys: a controller looks left / right and behind
; (XInput pads, or any controller Windows lists). 0 = off.
ControllerLook=1
; What looks left / right / back (set them on the KEYBINDS tab): DPAD_LEFT /
; RIGHT / UP / DOWN, A, B, X, Y, LB, RB, LT, RT, LS_CLICK, RS_CLICK, BACK, START,
; a stick one way (LS_X+, LS_X-, LS_Y+, LS_Y-, RS_X+ ... RS_Y-), an Xbox Elite
; paddle (PADDLE1..4), another controller's button or axis (JOY_BUTTON1..32,
; JOY_X+ / JOY_X- ... JOY_V-), or NONE.
LookLeftControl=DPAD_LEFT
LookRightControl=DPAD_RIGHT
LookBackControl=DPAD_DOWN
; How far left / right looks turn the head, in degrees
LookSideDeg=90
; How quickly the head turns to look and back again (2..40, higher = faster;
; 12 turns 90 degrees in about a quarter of a second)
LookTurnSpeed=12
; Look to apex: in corners the head turns toward the apex, the way the bike's path is turning,
; more the tighter the corner. 0 = off, 1 = looks about a second down the line (at most 45 deg).
ApexLook=0
; How quickly it turns toward the apex and back after the corner (0.5..5, lower = more gradual;
; 2.5 settles in about a second)
ApexSpeed=2.5
; Anticipation: work in progress, always off for now (this value is ignored)
ApexAnticipation=0
; Custom camera: extra eye offsets while looking left / right / back, in units
; (metres). + = forward / up, along the bike.
LookSideForward=0
LookSideHeight=0
LookBackForward=0
LookBackHeight=0

[Neck]
; Low-pass on eye height, in 1/seconds. 0 = off. Irons out vertical head-bob jitter.
VerticalResponse=20
; How far the smoothed eye height may trail the real head
MaxVerticalLag=0.05
; Neck compression: units of sag per g of vertical acceleration. Landings
; compress the neck, airtime stretches it.
CompressionPerG=0.012
; Neck spring: natural frequency (Hz) and damping ratio (1 = no bounce, lower = bouncier)
SpringHz=3.0
DampingRatio=0.5
MaxCompression=0.07
MaxExtension=0.04
; Forward head nod per unit of compression, in degrees per unit
NodDegPerMeter=40
; Speed of the velocity/acceleration estimate: a least-squares fit over the last 1.2/value
; seconds (12 -> 0.1 s). Lower = less noise, more delay.
AccelFilterHz=12

[Replay]
; Replays are recognised automatically (the helmet cam never touches them).
; 0 = the game's own replay camera (fixed direction, the rider swivels in front of it)
; 1 = 3rd person: a camera locked behind the rider, like the 3rd person view when riding
; 2 = helmet: a camera mounted on top of the rider's helmet, like a GoPro
Camera=0
; 3rd person camera: metres behind the rider, metres above the middle of the rider, and how
; far it looks down in degrees (negative = up)
Distance=4.5
Height=1.55
PitchDeg=12
; Helmet camera: how much its rotation is stabilised (0 = every jolt of the head, 1 = smoothest)
; and how much of the head's lean is taken out of it (0 = none, 1 = level horizon)
HelmetSmoothing=0.3
HelmetLevel=0
; Where it's mounted: 0 = on top of the helmet, 1 = its left side, 2 = its right side,
; 3 = the rider's chest (it turns with the body instead of the head)
HelmetMount=0
; Top mount: how far above the rider's eyes and how far forward it sits, and how far it's
; angled down (degrees)
HelmetHeight=0.7
HelmetForward=0
HelmetTiltDeg=20
; Side mount: the same, kept apart from the top mount's, and how far out from the middle of
; the head it sits
SideHeight=0.35
SideForward=-0.6
SideTiltDeg=5
SideOut=0.6
; Chest mount: how far above the middle of the shoulders (negative = below) and how far in front
; of them it sits, and how far it's angled down (degrees) from the torso
ChestHeight=-0.55
ChestForward=0.45
ChestTiltDeg=10

[Graphics]
; Shaders, pure OpenGL: the finished 3D picture (colour and depth) is reworked right before the
; HUD is drawn over it. Everything here can be changed live in the panel (GRAPHICS tab).
; 1 = on, 0 = the game exactly as it looks without the mod (texture filtering included)
Shaders=1
; Flips Shaders in game, for before / after comparisons. F7=0x76 (also on the KEYBINDS tab)
ToggleKey=0x76
; 1 = run the effects before the HUD, so text and menus stay sharp and bright. 0 = at the end
; of the frame (try it if the effects ever stop partway through the 3D scene).
ApplyBeforeHud=1
; Time of day in hours (0..24, e.g. 6.5 = 06:30, 19 = sunset, 0 = midnight); -1 = the game's
; own lighting
TimeOfDay=-1
; 1 = the time of day also moves the game's sun, so shading on bikes and objects follows it
MoveSun=1
; How much the moon lights the track at night (0..2: 1 = default, 0 = pitch black, 2 = twice as bright)
NightBrightness=1
; 1 = with a time of day set, hide the game's own lens flare (it stays where the game's sun is, so at
; night it would glare out of the dark sky). Set 0 if any part of the HUD goes missing with it.
HideGameFlare=1
; 1 if shadows fall toward the sun instead of away from it (the game's light points the other way)
InvertLight=0
; Sun shadows (0..1)
Shadows=0.6
; 1 = detailed shadows: bikes, riders and objects are drawn a second time from the sun (shadow
; map), for full sharp shadows even from things off screen. 0 = screen-space shadows only.
ShadowMap=1
; How far around the camera the detailed shadows reach (m, 5..200), and their resolution
; (0 = 2048, 1 = 4096, 2 = 8192: higher keeps long distances sharp, needs a stronger graphics card)
ShadowDistanceM=20
ShadowResolution=0
; How soft the detailed shadows' edges are (0..1): 0 crisp, 1 soft (smooths the steps a low sun can
; leave along shadows on berms and slopes)
ShadowSoftness=0.5
; 1 = static objects' detailed shadows are drawn all together once per frame (much faster, the same
; picture). 0 = one at a time, as before: only if some object's shadow ever looks wrong.
ShadowBatch=1
; How far the screen-space (contact) shadows reach, in metres
ShadowLength=6
; The bike's headlight (0..1): lights the track ahead when the time of day makes it dark
Headlight=0.8
; How wide the beam spreads to each side (5..90 degrees: the panel shows the full width, up to 180;
; it always lights the ground from the front
; wheel out), where the plate sits in first person (metres from the rider's eyes, along the bike:
; forward, and up; negative = below), and where it's aimed (degrees above level: up shows more of
; what's ahead, -20..15, 0 = level)
HeadlightBeamDeg=22
HeadlightForward=0.55
HeadlightHeight=-0.45
HeadlightAimDeg=0
; 1 = a headlight on every bike around you too (found by their wheels), 0 = only yours
HeadlightEveryBike=1
; Ambient occlusion (0..1) and its radius in metres
AmbientOcclusion=0.5
AORadius=0.8
SunRays=0.35
; Bloom (0..1) and the brightness (0..1) where it starts
Bloom=0.3
BloomThreshold=0.7
; Exposure in EV (+1 = twice as bright); contrast -0.5..0.5; saturation -1..1; vignette 0..1
Exposure=0
Contrast=0
Saturation=0
Vignette=0.2
; 0 = off, 1 = FXAA, 2 = FXAA high quality
AntiAliasing=1
Sharpen=0.25
; Anisotropic filtering 1..16 (1 = off), trilinear 1 / 0, LOD bias -2..0 (lower = sharper)
Anisotropy=16
Trilinear=1
TextureLodBias=0
; Fine dirt detail on the track surface (0..1) and the size of its grains (0.5..2)
DirtDetail=0.6
DirtScale=1
; Ruts your tires dig in the dirt (0..1; they stay on the track about 160 m around you) and mud
; caked on your tires (0..1). Both follow your bike's wheels, found once you ride a few metres.
; Between them, how far back along your ride the ruts are remembered (segments per wheel, 10000
; ..1000000: both wheels keep that many, 40000 is about 4 MB and a million about 92 MB; they are
; pressed into the ground again wherever the map around you reuses ground, so marks come back
; wherever you return to; the count is indexed, so a big one stays quick to re-press).
; What the mod learns about your bike in first person is kept in a [Learned] section at the end.
TireMarks=0.7
MarkCacheSegs=40000
; 1 = tire marks and tire dirt on every bike around you (a lobby, a replay), any model.
MarksEveryBike=0
TireDirt=0.6
; Camera motion blur (0..1); depth of field (0..1) and its focus in metres (0 = auto)
MotionBlur=0
DepthOfField=0
DofFocus=0
; 1 = write every shader the game compiles to MXS_REMASTERED_shaders\ (for development)
DumpShaders=0

[Weather]
; Rain: 1 = rain falling around you, wet ground, bikes and riders, puddles, a dark overcast sky; 0 = off
Rain=0
; How hard it rains (0..1): the drops around you, the ripples in the puddles, the haze; 0 = wet, nothing falling
Rainfall=0.6
; How hard the wind blows the rain (0..1)
RainWind=0.15
; How wet everything looks (0..1): darker dirt, and the shine on the ground, the bikes and the riders
Wetness=0.75
; How much standing water (0..1): puddles on the flat ground, water in the deepest ruts
Puddles=0.5
; How strongly the puddles and wet surfaces reflect the sky and what's around them (0..1)
Reflections=0.8
; Snow: 1 = snow on the ground (your ruts dig through it to the dirt) under an overcast sky; 0 = off
Snow=0
; How heavily it falls (0..1): flakes around you and the haze they make
Snowfall=0.5
; How hard the wind blows the falling snow (0..1)
Wind=0.2

[Other]
; 1 = hide the game's HUD (timing, positions, chat) while you ride or watch a replay. Moving or
; clicking the mouse (or Esc) shows it again for a few seconds; the game's menus are never touched.
HideHud=0
; 1 = hide the game's mouse cursor while you ride or watch a replay (it comes back when you move
; the mouse; never hidden in the game's menus)
HideCursor=0
; 1 = a dab indicator at the bottom right, by the speedometer: a red rider standing on the bike,
; or a green one sitting while you hold the game's Sit/Dab key (its Sticky Sit/Dab and Dab When
; Stopped settings followed)
DabIndicator=0
; The dab indicator's Sticky Sit/Dab: 0 = as the game's settings file says, 1 = off (sit while
; the button is held), 2 = on (a press sits, the next stands)
DabSticky=0
; Brake squeal (0..1): your brakes squeal when you brake hard (the game's own brake controls);
; its loudness, 0 = off
BrakeSqueal=0
; 1 = with the game in windowed mode, its window covers the whole screen with no border
; (borderless fullscreen); 0 puts it back. Shared by all the presets.
FullscreenWindow=0
; 1 = the settings menu fades out, all but the slider, while you adjust a GRAPHICS slider
FadeMenu=1

[Presets]
; Which of the five presets (1-5) is in use: its settings are the ones above. SAVE in the menu
; keeps the others in sections of their own ([Preset1] .. [Preset5]). Name1 .. Name5: their names
; in the menu (click the preset in use to rename it; none: its number).
Active=1
